<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prof. Dr. Latifa Afrin Dill Naher — Physiology Teaching Assistant</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <h1>Prof. Dr. Latifa Afrin Dill Naher</h1>
            <p class="header-subtitle">
                Physiology Teaching Assistant | Physiology, Universal Medical
                College, Dhaka
            </p>
        </div>
    </header>

    <section id="knowledge-panel" class="knowledge-panel">
        <div class="panel-bar">
            <span class="panel-title">📚 Research Publications &amp; MEU Activities</span>
            <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body">
                Show details ▾
            </button>
        </div>
        <div id="panel-body" class="panel-body" hidden>
            <div class="tabs" role="tablist">
                <button id="tab-pub-btn" class="tab-btn active" role="tab" aria-selected="true">
                    📄 Publications (journal &amp; volume)
                </button>
                <button id="tab-meu-btn" class="tab-btn" role="tab" aria-selected="false">
                    🏫 MEU Activities
                </button>
            </div>
            <div id="tab-publications" class="tab-content" role="tabpanel"></div>
            <div id="tab-meu" class="tab-content" role="tabpanel" hidden></div>
        </div>
    </section>

    <main id="chat-area" class="chat-area" aria-live="polite"></main>

    <div id="suggestions" class="suggestions">
        <button class="chip" data-question="List her research publications with the journal name and volume number.">📄 Publications &amp; volume</button>
        <button class="chip" data-question="What are her activities as Member Secretary and Coordinator of the MEU at UMC?">🏫 MEU activities</button>
        <button class="chip" data-question="Tell me about her research background in Physiology.">🔬 Research background</button>
    </div>

    <form id="chat-form" class="input-bar" autocomplete="off">
        <label for="user-input" class="sr-only">Type your message</label>
        <input
            id="user-input"
            type="text"
            placeholder="Ask a Physiology question…"
            autocomplete="off"
            required
        />
        <button id="send-button" type="submit">Send</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
