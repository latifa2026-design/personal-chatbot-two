<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prof. Dr. Latifa Afrin Dill Naher — Physiology Teaching Assistant</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <h1>Prof. Dr. Latifa Afrin Dill Naher</h1>
            <p class="header-subtitle">
                Physiology Teaching Assistant | Physiology, Universal Medical
                College, Dhaka
            </p>
        </div>
    </header>

    <main id="chat-area" class="chat-area" aria-live="polite"></main>

    <form id="chat-form" class="input-bar" autocomplete="off">
        <label for="user-input" class="sr-only">Type your message</label>
        <input
            id="user-input"
            type="text"
            placeholder="Ask a Physiology question…"
            autocomplete="off"
            required
        />
        <button id="send-button" type="submit">Send</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
